name: Shared quality gate

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out; defaults to the caller's event revision.
        required: false
        type: string
        default: ""
      upload_dist:
        description: Upload the validated distributions for a published release run.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Test, lint, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install locked development and Gmail dependencies
        run: uv sync --locked --group dev --extra gmail

      - name: Run unit tests with coverage
        run: uv run pytest --cov=pintos_utils --cov-report=term-missing

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Type-check with mypy
        run: uv run mypy src scripts/release_preflight.py

      - name: Build distributions
        run: uv build --no-sources

      - name: Verify built distributions and metadata
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          import os
          import re
          import tarfile
          import tomllib
          import zipfile
          from email.parser import BytesParser
          from email.policy import compat32
          from pathlib import Path

          root = Path.cwd()
          dist = Path(os.environ.get("PINTOS_DIST_DIR", root / "dist"))
          project = tomllib.loads((root / "pyproject.toml").read_text())["project"]
          version = project["version"]
          expected_files = {
              f"pintos_utils-{version}-py3-none-any.whl",
              f"pintos_utils-{version}.tar.gz",
          }
          actual_files = {
              path.name
              for path in dist.iterdir()
              if path.is_file() and not path.name.startswith(".")
          }
          if actual_files != expected_files:
              raise SystemExit(
                  f"Expected exactly {sorted(expected_files)} in dist/, got {sorted(actual_files)}"
              )

          license_text = (root / "LICENSE").read_bytes()
          expected_gmail = {
              re.sub(r"[-_.]+", "-", re.match(r"[A-Za-z0-9_.-]+", requirement)[0]).lower()
              for requirement in project["optional-dependencies"]["gmail"]
          }

          def check_metadata(label: str, data: bytes) -> None:
              metadata = BytesParser(policy=compat32).parsebytes(data)
              if metadata.get("Name") != project["name"]:
                  raise SystemExit(f"{label}: unexpected package name {metadata.get('Name')!r}")
              if metadata.get("Version") != version:
                  raise SystemExit(f"{label}: unexpected version {metadata.get('Version')!r}")
              if metadata.get("Requires-Python") != project["requires-python"]:
                  raise SystemExit(f"{label}: Python requirement does not match pyproject.toml")
              if metadata.get("License-Expression") != "MIT":
                  raise SystemExit(f"{label}: MIT License-Expression metadata is missing")
              if "LICENSE" not in (metadata.get_all("License-File") or []):
                  raise SystemExit(f"{label}: LICENSE is absent from License-File metadata")
              if "gmail" not in (metadata.get_all("Provides-Extra") or []):
                  raise SystemExit(f"{label}: Gmail extra metadata is missing")
              actual_gmail = {
                  re.sub(r"[-_.]+", "-", match.group(1)).lower()
                  for value in metadata.get_all("Requires-Dist") or []
                  if "extra == 'gmail'" in value or 'extra == "gmail"' in value
                  if (match := re.match(r"\s*([A-Za-z0-9_.-]+)", value))
              }
              if actual_gmail != expected_gmail:
                  raise SystemExit(f"{label}: Gmail dependencies do not match pyproject.toml")
              if not any(
                  item.startswith("Source, https://github.com/PINTOS-LTDA/python-utils")
                  for item in metadata.get_all("Project-URL") or []
              ):
                  raise SystemExit(f"{label}: canonical Source URL metadata is missing")

          wheel_path = dist / f"pintos_utils-{version}-py3-none-any.whl"
          with zipfile.ZipFile(wheel_path) as wheel:
              names = wheel.namelist()
              metadata_paths = [name for name in names if name.endswith(".dist-info/METADATA")]
              license_paths = [
                  name for name in names if name.endswith(".dist-info/licenses/LICENSE")
              ]
              if len(metadata_paths) != 1 or len(license_paths) != 1:
                  raise SystemExit("Wheel must contain one METADATA file and one dist-info/licenses/LICENSE")
              check_metadata("wheel", wheel.read(metadata_paths[0]))
              if wheel.read(license_paths[0]) != license_text:
                  raise SystemExit("Wheel LICENSE content does not match repository LICENSE")

          sdist_path = dist / f"pintos_utils-{version}.tar.gz"
          with tarfile.open(sdist_path, "r:gz") as sdist:
              members = [member for member in sdist.getmembers() if member.isfile()]
              metadata_members = [member for member in members if member.name.endswith("/PKG-INFO")]
              license_members = [member for member in members if member.name.endswith("/LICENSE")]
              if len(metadata_members) != 1 or len(license_members) != 1:
                  raise SystemExit("sdist must contain one PKG-INFO file and one LICENSE file")
              metadata_file = sdist.extractfile(metadata_members[0])
              license_file = sdist.extractfile(license_members[0])
              if metadata_file is None or license_file is None:
                  raise SystemExit("Unable to read sdist metadata or license file")
              check_metadata("sdist", metadata_file.read())
              if license_file.read() != license_text:
                  raise SystemExit("sdist LICENSE content does not match repository LICENSE")

          print("Verified one wheel and one sdist with matching package, version, metadata, and license.")
          PY

      - name: Upload release distributions
        if: ${{ inputs.upload_dist && github.event_name == 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
